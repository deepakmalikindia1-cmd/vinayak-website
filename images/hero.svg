    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e88d6"/><stop offset="1" stop-color="#0b3d91"/></linearGradient>
    <clipPath id="c"><rect width="600" height="480" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
