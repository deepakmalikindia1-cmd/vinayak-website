      <rect x="196" y="258" width="70" height="30" fill="#7cc2ef"/><rect x="268" y="258" width="70" height="30" fill="#0b3d91"/>
      <rect x="232" y="226" width="70" height="30" fill="#1e9be0"/>
      <g stroke="#ffffff" stroke-opacity=".35" stroke-width="2">
