        <path d="M208 261v24M220 261v24M232 261v24M244 261v24M256 261v24M280 261v24M292 261v24M304 261v24M316 261v24M328 261v24M244 229v24M256 229v24M268 229v24M280 229v24M292 229v24"/>
      </g>
