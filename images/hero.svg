    <circle cx="470" cy="92" r="46" fill="#ffffff"/><circle cx="470" cy="92" r="34" fill="#cfe6fa"/>
    <g fill="#ffffff" opacity=".95"><ellipse cx="120" cy="80" rx="52" ry="16"/><ellipse cx="150" cy="70" rx="32" ry="18"/><ellipse cx="380" cy="150" rx="44" ry="12"/></g>
